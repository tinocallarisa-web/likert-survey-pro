name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem first, please — not the solution. It often has an answer today.
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Scale and neutral handling", "Colours and conditional formatting", "Labels", "Top/Bottom box and NPS", "Benchmark", "Groups", "Accessibility", "Other"]
    validations: { required: true }
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead
